    let currentTabIndices = { 0: 'food', 1: 'food', 2: 'food', 3: 'food', 4: 'food' };
    let currentPocketRegion = {}; 

    const tabsContainer = document.getElementById('tabs-container');
    const contentContainer = document.getElementById('content-container');
    const mapIframe = document.getElementById('map-iframe');

    function getAllAvailableRegions() {
      const regions = new Set();
      pocketDB.forEach(item => { if (item.region) regions.add(item.region); });
      return Array.from(regions).sort();
    }

    function getScheduledDays(itemName) {
      let days = [];
      appData.forEach(day => {
        let isIncluded = false;
        day.events.forEach(ev => {
          if (ev.subItems && ev.subItems.find(s => s.name === itemName)) isIncluded = true;
        });
        if (isIncluded) days.push(day.label.split(' ')[0]); 
      });
      return days;
    }

    async function loadFromCloud() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, { headers: { 'X-Master-Key': JSONBIN_API_KEY } });
        const data = await res.json();
        if (data && data.record) {
          
          // 【資料升級機制】檢查雲端上是否為含有斜線 "/" 的舊版 V13 資料
          const isOldFormat = data.record.pocketDB && data.record.pocketDB.some(p => p.region && p.region.includes('/'));
          const isEmpty = !data.record.appData || data.record.appData.length === 0;

          if (isEmpty || isOldFormat) {
            console.log("偵測到舊版或空資料，自動覆寫為 V14 原子化新資料...");
            appData = initialItinerary; 
            pocketDB = initialPocketDB; 
            syncWithCloud(); // 強制上傳新資料
          } else {
            appData = data.record.appData; 
            pocketDB = data.record.pocketDB;
          }
        }
      } catch (e) { console.error('載入失敗', e); }
      renderApp();
    }

    async function syncWithCloud() {
      document.querySelector('.sync-btn').innerText = '⏳ 儲存中...';
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_API_KEY },
          body: JSON.stringify({ appData, pocketDB })
        });
      } catch (e) { console.error('同步錯誤', e); }
      document.querySelector('.sync-btn').innerText = '🔄 同步最新';
    }

    function renderApp() {
      tabsContainer.innerHTML = '';
      contentContainer.innerHTML = '';

      appData.forEach((day, dayIndex) => {
        if (!currentPocketRegion[dayIndex]) currentPocketRegion[dayIndex] = 'All';

        const tab = document.createElement('div');
        tab.className = `tab ${dayIndex === 0 ? 'active' : ''}`;
        tab.innerText = day.label;
        tab.onclick = () => switchTab(dayIndex);
        tabsContainer.appendChild(tab);

        const content = document.createElement('div');
        content.className = `day-content ${dayIndex === 0 ? 'active' : ''}`;
        content.id = `content-${dayIndex}`;
        
        let html = `
          <div class="day-header-row">
            <h2 style="margin:0; font-size:18px;">${day.title}</h2>
            <button class="btn-setting" onclick="openDayRegionModal(${dayIndex})">⚙️ 設定區域</button>
          </div>
        `;
        
        html += `<div class="timeline-list" id="timeline-list-${dayIndex}">`;
        day.events.forEach((ev, evIndex) => {
          const searchQuery = ev.mapQuery || (ev.title + ' Seoul');
          let subItemsHtml = `<div class="sub-items-container" data-day="${dayIndex}" data-event="${evIndex}">`;
          if (ev.subItems && ev.subItems.length > 0) {
            ev.subItems.forEach((sub, subIdx) => {
               subItemsHtml += `
                 <span class="sub-item-chip">
                   <div class="chip-drag-handle">⋮</div>
                   <div class="chip-text" onclick="event.stopPropagation(); viewSubItem('${sub.name.replace(/'/g, "\\'")}', '${sub.mapQuery.replace(/'/g, "\\'")}')">${sub.name}</div>
                   <b class="chip-close" onclick="event.stopPropagation(); removeSubItem(${dayIndex}, ${evIndex}, ${subIdx})">×</b>
                 </span>`;
            });
          }
          subItemsHtml += '</div>';

          html += `
            <div class="timeline-item" data-ev-index="${evIndex}" onclick="updateMap('${searchQuery}', this)">
              <div class="block-drag-handle">⋮⋮</div>
              <div class="timeline-header">
                <div class="time-col">${ev.time}</div>
                <div class="content-col">
                  <h3>${ev.title}</h3>
                  <p>${ev.desc}</p>
                </div>
              </div>
              ${subItemsHtml}
              <div class="action-btns">
                <button class="btn-small" onclick="event.stopPropagation(); openBlockModal(${dayIndex}, ${evIndex})">編輯</button>
                <button class="btn-small danger" onclick="event.stopPropagation(); deleteEvent(${dayIndex}, ${evIndex})">刪除</button>
              </div>
            </div>`;
        });
        html += `</div>`;

        // 動態生成選單，完美支援單一標籤
        let regionOptions = `<option value="All">全部 (${day.regions.length > 0 ? day.regions.join('+') : '未設定'})</option>`;
        day.regions.forEach(r => {
          regionOptions += `<option value="${r}" ${currentPocketRegion[dayIndex] === r ? 'selected' : ''}>只看 ${r}</option>`;
        });

        html += `
          <button class="btn-add-block" onclick="openBlockModal(${dayIndex})">➕ 新增空白區間</button>
          <div class="pocket-section">
            <button class="pocket-toggle" onclick="togglePocket(${dayIndex})">💡 展開專屬口袋名單 ▾</button>
            <div class="pocket-content" id="pocket-content-${dayIndex}">
              <div style="display:flex; justify-content:space-between; align-items:center; margin:12px 0;">
                <span style="font-size:13px; font-weight:bold; color:#555;">📍 篩選：</span>
                <select onchange="switchPocketRegion(${dayIndex}, this.value)" style="padding:4px 8px; border-radius:6px; border:1px solid #ccc; font-size:13px;">
                  ${regionOptions}
                </select>
              </div>
              <div class="pocket-tabs">
                <div class="p-tab ${currentTabIndices[dayIndex]==='food'?'active':''}" onclick="switchPocketTab(${dayIndex}, 'food')">🍽️ 美食</div>
                <div class="p-tab ${currentTabIndices[dayIndex]==='shop'?'active':''}" onclick="switchPocketTab(${dayIndex}, 'shop')">🛍️ 商店</div>
              </div>
              <div class="pocket-grid" id="pocket-grid-${dayIndex}"></div>
            </div>
          </div>
          <button class="btn-add-global" onclick="document.getElementById('pocketModal').style.display='flex'">➕ 新增全域口袋名單</button>
        `;

        content.innerHTML = html;
        contentContainer.appendChild(content);
        
        renderPocketGrid(dayIndex, 'All');
        initSortable(dayIndex);
      });
    }

    function initSortable(dayIndex) {
      const listEl = document.getElementById(`timeline-list-${dayIndex}`);
      if (listEl) {
        Sortable.create(listEl, {
          animation: 150, handle: '.block-drag-handle',
          onEnd: function (evt) {
            const movedItem = appData[dayIndex].events.splice(evt.oldIndex, 1)[0];
            appData[dayIndex].events.splice(evt.newIndex, 0, movedItem);
            syncWithCloud();
          }
        });
      }
      document.querySelectorAll(`#content-${dayIndex} .sub-items-container`).forEach(container => {
        Sortable.create(container, {
          group: 'shared-subitems', animation: 150, handle: '.chip-drag-handle',
          onEnd: function (evt) {
            const fromDay = dayIndex; const toDay = parseInt(evt.to.getAttribute('data-day'));
            const fromEv = parseInt(evt.from.getAttribute('data-event')); const toEv = parseInt(evt.to.getAttribute('data-event'));
            const itemData = appData[fromDay].events[fromEv].subItems.splice(evt.oldIndex, 1)[0];
            appData[toDay].events[toEv].subItems.splice(evt.newIndex, 0, itemData);
            syncWithCloud(); renderApp(); 
          }
        });
      });
    }

    window.openDayRegionModal = function(dayIndex) {
      document.getElementById('drDayIndex').value = dayIndex;
      document.getElementById('drTitle').value = appData[dayIndex].title;
      
      const allRegions = getAllAvailableRegions();
      const currentRegions = appData[dayIndex].regions || [];
      const cbGroup = document.getElementById('drCheckboxes');
      cbGroup.innerHTML = '';
      
      allRegions.forEach(r => {
        const isChecked = currentRegions.includes(r) ? 'checked' : '';
        cbGroup.innerHTML += `
          <label>
            <input type="checkbox" value="${r}" ${isChecked} style="display:none;">
            <span>${r}</span>
          </label>
        `;
      });
      document.getElementById('dayRegionModal').style.display = 'flex';
    };

    window.saveDayRegions = function() {
      const dayIndex = document.getElementById('drDayIndex').value;
      appData[dayIndex].title = document.getElementById('drTitle').value;
      
      const checkedBoxes = document.querySelectorAll('#drCheckboxes input[type="checkbox"]:checked');
      const newRegions = Array.from(checkedBoxes).map(cb => cb.value);
      appData[dayIndex].regions = newRegions;
      currentPocketRegion[dayIndex] = 'All'; 
      
      syncWithCloud();
      document.getElementById('dayRegionModal').style.display = 'none';
      renderApp(); switchTab(dayIndex);
    };

    window.openBlockModal = function(dayIndex, evIndex = null) {
      document.getElementById('bDayIndex').value = dayIndex;
      document.getElementById('bEvIndex').value = evIndex !== null ? evIndex : '';
      if (evIndex !== null) {
        const ev = appData[dayIndex].events[evIndex];
        document.getElementById('bTime').value = ev.time || '';
        document.getElementById('bTitle').value = ev.title || '';
        document.getElementById('bMapQ').value = ev.mapQuery || '';
        document.getElementById('bDesc').value = ev.desc || '';
      } else {
        document.getElementById('bTime').value = ''; document.getElementById('bTitle').value = '';
        document.getElementById('bMapQ').value = ''; document.getElementById('bDesc').value = '';
      }
      document.getElementById('blockModal').style.display = 'flex';
    };

    window.saveBlock = function() {
      const dayIndex = document.getElementById('bDayIndex').value;
      const evIndex = document.getElementById('bEvIndex').value;
      const newBlock = {
        time: document.getElementById('bTime').value || '12:00',
        title: document.getElementById('bTitle').value || '新區間',
        mapQuery: document.getElementById('bMapQ').value || '',
        desc: document.getElementById('bDesc').value || ''
      };
      if (evIndex === '') {
        newBlock.subItems = []; appData[dayIndex].events.push(newBlock);
      } else {
        newBlock.subItems = appData[dayIndex].events[evIndex].subItems || [];
        appData[dayIndex].events[evIndex] = newBlock;
      }
      appData[dayIndex].events.sort((a, b) => a.time.localeCompare(b.time));
      syncWithCloud(); document.getElementById('blockModal').style.display = 'none';
      renderApp(); switchTab(dayIndex);
    };

    function switchTab(activeIndex) {
      document.querySelectorAll('.tab').forEach((tab, index) => tab.classList.toggle('active', index === activeIndex));
      document.querySelectorAll('.day-content').forEach((content, index) => content.classList.toggle('active', index === activeIndex));
      document.querySelectorAll('.tab')[activeIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    function togglePocket(dayIndex) { document.getElementById(`pocket-content-${dayIndex}`).classList.toggle('open'); }
    function switchPocketRegion(dayIndex, region) { currentPocketRegion[dayIndex] = region; renderPocketGrid(dayIndex, 'All'); }
    function switchPocketTab(dayIndex, type) {
      currentTabIndices[dayIndex] = type;
      const tabs = document.querySelectorAll(`#content-${dayIndex} .p-tab`);
      tabs[0].classList.toggle('active', type === 'food'); tabs[1].classList.toggle('active', type === 'shop');
      renderPocketGrid(dayIndex, 'All');
    }

    function renderPocketGrid(dayIndex, selectedCategory = 'All') {
      const grid = document.getElementById(`pocket-grid-${dayIndex}`);
      if(!grid) return;
      
      const type = currentTabIndices[dayIndex];
      const selectedFilter = currentPocketRegion[dayIndex];
      const dayRegions = appData[dayIndex].regions || [];
      
      let baseFiltered = pocketDB.filter(item => item.type === type);
      if (selectedFilter === 'All') {
        baseFiltered = baseFiltered.filter(item => dayRegions.includes(item.region));
      } else {
        baseFiltered = baseFiltered.filter(item => item.region === selectedFilter);
      }
      
      if(baseFiltered.length === 0) {
        grid.innerHTML = `<p style="color:#888; font-size:13px; text-align:center;">此目標區域內目前沒有符合的選項！</p>`; return;
      }
      
      const categories = [...new Set(baseFiltered.map(item => item.category))];
      let html = `<div style="display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; padding-bottom:4px; scrollbar-width:none;">`;
      const allActive = selectedCategory === 'All' ? 'background:var(--primary); color:white; border-color:var(--primary);' : 'background:white; color:#555; border-color:#ddd;';
      html += `<button style="padding:4px 12px; font-size:13px; border-radius:12px; border:1px solid; cursor:pointer; flex-shrink:0; ${allActive}" onclick="renderPocketGrid(${dayIndex}, 'All')">全部</button>`;
      categories.forEach(cat => {
        const isActive = selectedCategory === cat ? 'background:var(--primary); color:white; border-color:var(--primary);' : 'background:white; color:#555; border-color:#ddd;';
        html += `<button style="padding:4px 12px; font-size:13px; border-radius:12px; border:1px solid; cursor:pointer; flex-shrink:0; ${isActive}" onclick="renderPocketGrid(${dayIndex}, '${cat}')">${cat}</button>`;
      });
      html += `</div><div style="display:grid; grid-template-columns:1fr; gap:12px;">`;

      const displayItems = selectedCategory === 'All' ? baseFiltered : baseFiltered.filter(item => item.category === selectedCategory);
      
      displayItems.forEach((item) => {
        const safeName = item.name.replace(/'/g, "\\'"); const safeQuery = item.mapQuery.replace(/'/g, "\\'");
        
        const scheduledDays = getScheduledDays(item.name);
        const badgeHtml = scheduledDays.length > 0 ? `<div class="scheduled-badge">📍 排入 ${scheduledDays.join(', ')}</div>` : '';

        html += `
          <div class="pocket-card ${item.type}" onclick="updateMap('${safeQuery}', this)">
            <button class="del-btn" onclick="event.stopPropagation(); deleteFromPocket('${safeName}')">🗑️</button>
            ${badgeHtml}
            <h4>${item.name}</h4><span class="cat-tag">${item.region} · ${item.category}</span><p>${item.desc}</p>
            <button class="btn-small" style="position:absolute; bottom:12px; right:12px; background:var(--primary); color:white;" onclick="event.stopPropagation(); openBlockSelectModal(${dayIndex}, '${safeName}', '${safeQuery}')">➕ 加入</button>
          </div>`;
      });
      html += `</div>`; grid.innerHTML = html;
    }

    function openBlockSelectModal(dayIndex, name, mapQuery) {
      document.getElementById('bsItemName').innerText = name;
      document.getElementById('bsDayIndex').value = dayIndex;
      document.getElementById('bsItemMapQ').value = mapQuery;
      const selectEl = document.getElementById('bsBlockSelect'); selectEl.innerHTML = '';
      appData[dayIndex].events.forEach((ev, i) => {
        const option = document.createElement('option'); option.value = i; option.innerText = `[${ev.time}] ${ev.title}`; selectEl.appendChild(option);
      });
      document.getElementById('blockSelectModal').style.display = 'flex';
    }

    function confirmAddBlock() {
      const dayIndex = document.getElementById('bsDayIndex').value;
      const blockIndex = document.getElementById('bsBlockSelect').value;
      if (!appData[dayIndex].events[blockIndex].subItems) appData[dayIndex].events[blockIndex].subItems = [];
      appData[dayIndex].events[blockIndex].subItems.push({ 
        name: document.getElementById('bsItemName').innerText, 
        mapQuery: document.getElementById('bsItemMapQ').value 
      });
      syncWithCloud(); document.getElementById('blockSelectModal').style.display = 'none';
      renderApp(); switchTab(dayIndex); document.getElementById(`pocket-content-${dayIndex}`).classList.add('open');
    }

    function removeSubItem(dayIndex, evIndex, subIdx) {
      if(confirm('確定要從這個區間移除此項目嗎？')) { appData[dayIndex].events[evIndex].subItems.splice(subIdx, 1); syncWithCloud(); renderApp(); switchTab(dayIndex); }
    }

    function deleteFromPocket(name) {
      if(confirm(`確定徹底刪除 [${name}] 嗎？`)) { pocketDB = pocketDB.filter(item => item.name !== name); syncWithCloud(); renderApp(); }
    }

    function saveToPocket() {
      const name = document.getElementById('pName').value;
      const mapQuery = document.getElementById('pMapQ').value || name;
      const desc = document.getElementById('pDesc').value;
      const manualRegion = document.getElementById('pRegion').value.trim();
      if(!name) return alert("請輸入名稱！");
      
      let text = (name + " " + desc).toLowerCase(); let type = 'food'; let category = '日常快充'; 
      if (/(服飾|衣服|潮牌|包包|鞋|옷|apparel|fashion)/i.test(text)) { type = 'shop'; category = '服飾潮牌'; } 
      else if (/(咖啡|甜點|大福|麵包|茶|cafe|coffee|bakery)/i.test(text)) { type = 'food'; category = '續攤回血'; }
      
      let region = '其他';
      if (/(島山|dosan)/i.test(text)) region = '島山';
      else if (/(漢南|hannam)/i.test(text)) region = '漢南';
      else if (/(聖水|首爾林|seongsu)/i.test(text)) region = '聖水';
      else if (/(弘大|hongdae)/i.test(text)) region = '弘大';
      else if (/(延南|yeonnam)/i.test(text)) region = '延南';
      else if (/(明洞|myeongdong)/i.test(text)) region = '明洞';
      
      if (manualRegion !== '') region = manualRegion;
      
      pocketDB.push({ type, region, category, name, mapQuery, desc });
      syncWithCloud(); 
      alert(`已將 [${name}] 新增至【${region}】`);
      document.getElementById('pocketModal').style.display = 'none'; 
      document.getElementById('pName').value = ''; document.getElementById('pMapQ').value = ''; 
      document.getElementById('pDesc').value = ''; document.getElementById('pRegion').value = '';
      renderApp();
    }

    function deleteEvent(dayIndex, eventIndex) {
      if(confirm('確定要移除整個時間區間嗎？')) { appData[dayIndex].events.splice(eventIndex, 1); syncWithCloud(); renderApp(); switchTab(dayIndex); }
    }

    window.updateMap = function(query, cardElement) {
      if(mapIframe.dataset.currentQuery !== query) {
        mapIframe.src = `https://maps.google.com/maps?q=${encodeURIComponent(query)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
        mapIframe.dataset.currentQuery = query;
      }
      document.querySelectorAll('.timeline-item, .pocket-card').forEach(el => el.classList.remove('active-card'));
      if(cardElement) cardElement.classList.add('active-card');
    };

    window.viewSubItem = function(name, mapQuery) {
      updateMap(mapQuery, null); 
      const item = pocketDB.find(p => p.name === name);
      document.getElementById('infoName').innerText = name;
      if (item) {
        document.getElementById('infoTag').innerText = `📍 ${item.region} · ${item.category}`;
        document.getElementById('infoTag').style.display = 'inline-block';
        document.getElementById('infoDesc').innerText = item.desc || '無備註說明。';
      } else {
        document.getElementById('infoTag').style.display = 'none';
        document.getElementById('infoDesc').innerText = '此項目可能是手動輸入，或已從口袋名單中刪除。';
      }
      document.getElementById('infoModal').style.display = 'flex';
    };

    loadFromCloud();
  </script>
</body>
</html>
